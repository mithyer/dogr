<!doctype html>
<!--
  TEMPLATE of the dogr.dev "What's new" page (/ios/whatsnew). build-site.mjs writes one finished page per language to
  /<code>/ios/whatsnew/ from this file and the same strings table as the home page (site/i18n/strings.csv, keys "whatsnew.*").
  The same placeholders as page.html work here ({{key}}, {{@key}}, {{$name}}), and {{$home}} is the home page of this language.
  The list of versions is NOT in this file: whatsnew.js reads /ios/whatsnew-1.json in the browser and draws it, so a new
  version is a change of that file only (tools/whatsnew.mjs makes it).
  All comments in this file are removed from the finished pages.
-->
<html lang="{{$html}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{@whatsnew.meta.title}}</title>
<meta name="description" content="{{@whatsnew.meta.description}}">
<link rel="canonical" href="{{$canonical}}">
{{$alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dogr">
<meta property="og:url" content="{{$canonical}}">
<meta property="og:locale" content="{{$locale}}">
<meta property="og:title" content="{{@whatsnew.meta.title}}">
<meta property="og:description" content="{{@whatsnew.meta.description}}">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="wrap top simple">
  <a class="brand" href="{{$home}}"><img src="/icon.svg" alt="">Dogr<span class="for">{{brand.for}}</span></a>
  <!-- The same language menu as the home page (page.js fills it in); data-folder makes its links lead to this page in the other languages. -->
  <details class="lang" data-current="{{$code}}" data-folder="{{$folder}}">
    <summary aria-label="{{@lang.label}}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>{{$name}}</span></summary>
    <div class="menu">
      <ul>
{{$languages}}
      </ul>
    </div>
  </details>
</header>

<main class="wrap doc whatsnew">
  <p class="crumb"><a href="{{$home}}">{{whatsnew.back}}</a></p>
  <h1>{{whatsnew.h1}}</h1>
  <p class="lead">{{whatsnew.intro}}</p>
  <!-- whatsnew.js replaces the content with the list: the newest version, then a button (data-older is its text) that shows the earlier ones.
       Its own texts for the states it draws (loading, a failure, the mark on the newest version) come from here, in this page's language. -->
  <div id="releases" data-src="/ios/whatsnew-1.json" data-lang="{{$code}}" data-loading="{{@whatsnew.loading}}" data-error="{{@whatsnew.error}}" data-latest="{{@whatsnew.latest}}" data-older="{{@whatsnew.older}}" aria-live="polite">
    <noscript><p class="status">{{whatsnew.noscript}}</p></noscript>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="links">
      <a href="/privacy/">{{footer.privacyLink}}</a>
      <a href="/support/">{{footer.supportLink}}</a>
      <a href="https://github.com/mithyer/dogr">{{footer.setup}}</a>
      <span class="contact"><a href="mailto:fb@dogr.dev">fb@dogr.dev</a> · <a href="https://github.com/mithyer">GitHub</a> · <a href="https://discord.gg/dprTGeM7U">Discord</a> · <a href="https://t.me/herdogr">Telegram</a></span>
    </div>
    <p>{{footer.indep}}</p>
    <p>{{footer.privacy}}</p>
    <p>{{footer.geo}}</p>
  </div>
</footer>

<script type="module" src="/page.js"></script>
<script type="module" src="/whatsnew.js"></script>
</body>
</html>
